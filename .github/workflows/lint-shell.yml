name: Lint Shell

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**/*.sh'
      - 'plugins/**/*.sh'
      - '.github/workflows/lint-shell.yml'
  pull_request:
    paths:
      - 'scripts/**/*.sh'
      - 'plugins/**/*.sh'
      - '.github/workflows/lint-shell.yml'

jobs:
  shell:
    name: Lint and format shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt

      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find scripts plugins -type f -name '*.sh' -print0 2>/dev/null || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          shfmt -d "${files[@]}"

      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(find scripts plugins -type f -name '*.sh' -print0 2>/dev/null || true)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No shell scripts found."
            exit 0
          fi

          shellcheck "${files[@]}"
