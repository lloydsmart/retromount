name: Lint Shell

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**/*.sh'
      - 'plugins/**/*.sh'
      - '.github/workflows/lint-shell.yml'
  pull_request:
    paths:
      - 'scripts/**/*.sh'
      - 'plugins/**/*.sh'
      - '.github/workflows/lint-shell.yml'

jobs:
  shell:
    name: Lint and format shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o shfmt
          chmod +x shfmt
          sudo mv shfmt /usr/local/bin/shfmt

      - name: Check formatting
        run: |
          shfmt -d -r scripts plugins

      - name: Lint shell scripts
        run: |
          find scripts plugins -name '*.sh' -print0 | xargs -0 shellcheck
