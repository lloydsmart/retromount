name: Validate Rust

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/validate-rust.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustfmt.toml'
      - 'clippy.toml'
      - '.github/workflows/validate-rust.yml'

concurrency:
  group: validate-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: "retromount-test-${{ matrix.os }}"

      - name: Install sccache
        if: runner.os != 'Windows'
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3.4.0
        with:
          crate: sccache
          version: "0.14.0"
          locked: false

      - name: Configure sccache
        if: runner.os != 'Windows'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Run tests (non-Windows with sccache)
        if: runner.os != 'Windows'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --locked --all-targets --all-features --verbose

      - name: Run tests (Windows without sccache)
        if: runner.os == 'Windows'
        run: cargo test --locked --all-targets --all-features --verbose

      - name: sccache stats
        if: always() && runner.os != 'Windows'
        run: sccache --show-stats

  build-release-linux:
    name: Build release binary (Linux)
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537
        with:
          toolchain: stable

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: "retromount-release-linux"

      - name: Install sccache
        uses: baptiste0928/cargo-install@f204293d9709061b7bc1756fec3ec4e2cd57dec0 # v3.4.0
        with:
          crate: sccache
          version: "0.14.0"
          locked: false

      - name: Configure sccache
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Build release binary
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release --all-features --verbose

      - name: Upload Linux release target artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: target-release-linux
          path: target
          if-no-files-found: error
          retention-days: 1

      - name: sccache stats
        if: always()
        run: sccache --show-stats
