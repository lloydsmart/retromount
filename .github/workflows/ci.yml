name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: "retromount-lint"

      - name: Install sccache
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sccache
          version: "0.14.0"
          locked: false

      - name: Configure sccache
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        env:
          RUSTC_WRAPPER: sccache
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: "retromount-test-${{ matrix.os }}"

      - name: Install sccache
        if: runner.os != 'Windows'
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sccache
          version: "0.14.0"
          locked: false

      - name: Configure sccache
        if: runner.os != 'Windows'
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Run tests (non-Windows with sccache)
        if: runner.os != 'Windows'
        env:
          RUSTC_WRAPPER: sccache
        run: cargo test --locked --all-targets --all-features --verbose

      - name: Run tests (Windows without sccache)
        if: runner.os == 'Windows'
        run: cargo test --locked --all-targets --all-features --verbose

      - name: sccache stats
        if: always() && runner.os != 'Windows'
        run: sccache --show-stats

  build-release-linux:
    needs: lint
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: "retromount-release-linux"

      - name: Install sccache
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sccache
          version: "0.14.0"
          locked: false

      - name: Configure sccache
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Build release binary
        env:
          RUSTC_WRAPPER: sccache
        run: cargo build --locked --release --all-features --verbose

      - name: Upload Linux release target artifacts
        uses: actions/upload-artifact@v7
        with:
          name: target-release-linux
          path: target
          if-no-files-found: error
          retention-days: 1

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  package-deb:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build-release-linux]
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "on"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          shared-key: "retromount-package-deb"

      - name: Install sccache
        uses: baptiste0928/cargo-install@v3
        with:
          crate: sccache
          version: "0.14.0"
          locked: false

      - name: Configure sccache
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Install cargo-deb
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deb
          version: "^2"
          locked: false

      - name: Download Linux release target artifacts
        uses: actions/download-artifact@v7
        with:
          name: target-release-linux
          path: target

      - name: Build Debian package
        env:
          RUSTC_WRAPPER: sccache
        run: cargo deb --no-build

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: retromount-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats
        