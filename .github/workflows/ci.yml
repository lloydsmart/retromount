name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "retromount-lint"

      - name: Ensure sccache is installed
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            cargo install sccache --locked
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "retromount-test-${{ matrix.os }}"

      - name: Ensure sccache is installed
        shell: bash
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            cargo install sccache --locked
          fi

      - name: Run tests
        run: cargo test --locked --all-targets --all-features --verbose

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  build-release-linux:
    needs: lint
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "retromount-release-linux"

      - name: Ensure sccache is installed
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            cargo install sccache --locked
          fi

      - name: Build release binary
        run: cargo build --locked --release --all-features --verbose

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  package-deb:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, build-release-linux]
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: "retromount-package-deb"

      - name: Ensure sccache is installed
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            cargo install sccache --locked
          fi

      - name: Install cargo-deb
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deb
          version: "^2"
          locked: true

      - name: Build release binary
        run: cargo build --locked --release --all-features --verbose

      - name: Build Debian package
        run: cargo deb --no-build

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: retromount-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: sccache stats
        if: always()
        run: sccache --show-stats
        